name: Generate Manifest & Deploy

on:
  push:
    branches: [gh-pages]
    paths:
      - 'output/**'
      - 'input/**'
      - 'reference/**'
      - 'server/manifest.py'

jobs:
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate manifest.json
        run: python3 server/manifest.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/manifest.json
          git diff --cached --quiet || git commit -m "Auto: regenerate manifest.json"
          git push
